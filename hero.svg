<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#020617"/>
<stop offset="50%" stop-color="#0b1224"/>
<stop offset="100%" stop-color="#082f49"/>
</linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#334155"/>
<stop offset="100%" stop-color="#0f172a"/>
</linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#082f49"/>
<stop offset="100%" stop-color="#020617"/>
</linearGradient>
<radialGradient id="glow">
<stop offset="0%" stop-color="#22d3ee" stop-opacity=".22"/>
<stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
</radialGradient>
<filter id="neon">
<feGaussianBlur stdDeviation="3" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="soft">
<feGaussianBlur stdDeviation="24"/>
</filter>
<clipPath id="screenClip">
<rect x="220" y="240" width="700" height="420" rx="12"/>
</clipPath>
</defs>

<!-- Full Background -->
<rect width="1920" height="1080" fill="url(#bg)"/>

<!-- Glowing Background Orbs -->
<circle cx="350" cy="540" r="480" fill="url(#glow)" filter="url(#soft)">
<animate attributeName="opacity" values=".4;.8;.4" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="1570" cy="540" r="480" fill="url(#glow)" filter="url(#soft)">
<animate attributeName="opacity" values=".8;.4;.8" dur="6s" repeatCount="indefinite"/>
</circle>

<!-- Background Grid -->
<g stroke="#38bdf8" stroke-opacity=".045">
<path d="M0 180H1920"/><path d="M0 360H1920"/><path d="M0 540H1920"/><path d="M0 720H1920"/><path d="M0 900H1920"/>
<path d="M160 0V1080"/><path d="M320 0V1080"/><path d="M480 0V1080"/><path d="M640 0V1080"/><path d="M800 0V1080"/><path d="M960 0V1080"/>
<path d="M1120 0V1080"/><path d="M1280 0V1080"/><path d="M1440 0V1080"/><path d="M1600 0V1080"/><path d="M1760 0V1080"/>
</g>

<!-- Circuit Lines -->
<g fill="none" stroke="#22d3ee" stroke-width="2" opacity=".45">
<path d="M0 200H200V120H400"/>
<path d="M0 880H250V960H500"/>
<path d="M1920 200H1720V290H1550"/>
<path d="M1920 880H1670V800H1450"/>
</g>
<g fill="#67e8f9">
<circle cx="200" cy="200" r="6">
<animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/>
</circle>
<circle cx="1720" cy="200" r="6">
<animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/>
</circle>
</g>

<!-- Code Terminal (Left Side) -->
<g transform="translate(100, 180)">
<rect x="0" y="0" width="880" height="600" rx="18" fill="#020617" stroke="#164e63" stroke-width="3"/>
<rect x="30" y="30" width="820" height="500" rx="12" fill="url(#screen)" stroke="#0e7490" stroke-width="2"/>
<circle cx="60" cy="65" r="8" fill="#22d3ee"/>
<circle cx="90" cy="65" r="8" fill="#38bdf8"/>
<circle cx="120" cy="65" r="8" fill="#67e8f9"/>
<g clip-path="url(#screenClip)" font-family="monospace" font-size="22">
<text x="120" y="150" fill="#67e8f9">01</text>
<text x="120" y="210" fill="#67e8f9">02</text>
<text x="120" y="270" fill="#67e8f9">03</text>
<text x="120" y="330" fill="#67e8f9">04</text>
<text x="120" y="390" fill="#67e8f9">05</text>
<text x="180" y="150" fill="#38bdf8">const</text>
<text x="270" y="150" fill="#e2e8f0">robot =</text>
<text x="380" y="150" fill="#22d3ee">new</text>
<text x="440" y="150" fill="#f1f5f9">Robot();</text>
<text x="180" y="210" fill="#a5f3fc">robot</text>
<text x="250" y="210" fill="#e2e8f0">.</text>
<text x="265" y="210" fill="#38bdf8">think</text>
<text x="345" y="210" fill="#e2e8f0">();</text>
<text x="180" y="270" fill="#38bdf8">function</text>
<text x="310" y="270" fill="#f1f5f9">buildWeb()</text>
<text x="460" y="270" fill="#e2e8f0">{</text>
<text x="210" y="330" fill="#22d3ee">return</text>
<text x="310" y="330" fill="#a5f3fc">createProject</text>
<text x="500" y="330" fill="#e2e8f0">();</text>
<text x="180" y="390" fill="#38bdf8">}</text>
<text x="550" y="150" fill="#67e8f9">
&gt; coding...
<animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
</text>
<text x="550" y="210" fill="#22d3ee">
&gt; building...
<animate attributeName="opacity" values="0;0;1;1;0" dur="4s" repeatCount="indefinite"/>
</text>
<rect x="180" y="420" width="8" height="26" fill="#67e8f9">
<animate attributeName="x" values="180;260;340;420;500;580;660;740;180" dur="4s" repeatCount="indefinite"/>
</rect>
</g>
<rect x="360" y="550" width="240" height="18" rx="8" fill="#0f172a" stroke="#164e63"/>
</g>

<!-- Animated Robot (Right Side) -->
<g transform="translate(1200, 180)">
<ellipse cx="250" cy="580" rx="200" ry="28" fill="#020617" opacity=".7">
<animate attributeName="rx" values="200;220;200" dur="3s" repeatCount="indefinite"/>
</ellipse>
<g filter="url(#neon)">
<rect x="60" y="150" width="380" height="320" rx="100" fill="url(#body)" stroke="#22d3ee" stroke-width="5"/>
<rect x="95" y="185" width="310" height="220" rx="80" fill="#071827" stroke="#164e63" stroke-width="3"/>
<ellipse cx="250" cy="295" rx="120" ry="85" fill="#020617"/>
<g>
<ellipse cx="190" cy="295" rx="38" ry="46" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
<ellipse cx="310" cy="295" rx="38" ry="46" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
<circle cx="190" cy="295" r="18" fill="#67e8f9">
<animate attributeName="cy" values="288;302;288" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="310" cy="295" r="18" fill="#67e8f9">
<animate attributeName="cy" values="288;302;288" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="185" cy="288" r="5" fill="#ffffff"/>
<circle cx="305" cy="288" r="5" fill="#ffffff"/>
</g>
<path d="M190 355 Q250 395 310 355" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
<path d="M250 185V120" stroke="#22d3ee" stroke-width="6"/>
<circle cx="250" cy="105" r="14" fill="#67e8f9">
<animate attributeName="r" values="10;16;10" dur="2.5s" repeatCount="indefinite"/>
</circle>
</g>
<!-- Arms -->
<g>
<path d="M90 410L0 480" stroke="#22d3ee" stroke-width="18" stroke-linecap="round">
<animateTransform attributeName="transform" type="rotate" values="0 90 410;-10 90 410;0 90 410;10 90 410;0 90 410" dur="2.2s" repeatCount="indefinite"/>
</path>
<path d="M410 410L500 480" stroke="#22d3ee" stroke-width="18" stroke-linecap="round">
<animateTransform attributeName="transform" type="rotate" values="0 410 410;10 410 410;0 410 410;-10 410 410;0 410 410" dur="2.2s" repeatCount="indefinite"/>
</path>
</g>
</g>

<!-- Connecting Data Beams -->
<g fill="none" stroke="#22d3ee" stroke-width="3" opacity=".5">
<path d="M980 380H1100V300H1200"/>
<path d="M980 500H1100V580H1200"/>
</g>
<g fill="#67e8f9">
<circle cx="1040" cy="380" r="6">
<animate attributeName="cx" values="980;1040;1100;1040;980" dur="3.5s" repeatCount="indefinite"/>
</circle>
<circle cx="1040" cy="500" r="6">
<animate attributeName="cx" values="980;1040;1100;1040;980" dur="4s" repeatCount="indefinite"/>
</circle>
</g>
</svg>
