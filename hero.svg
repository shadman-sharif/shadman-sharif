<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#020617"/>
<stop offset=".5" stop-color="#0b1224"/>
<stop offset="1" stop-color="#06283d"/>
</linearGradient>

<radialGradient id="glow">
<stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/>
<stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
</radialGradient>

<filter id="blur">
<feGaussianBlur stdDeviation="18"/>
</filter>

<filter id="neon">
<feGaussianBlur stdDeviation="3" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<linearGradient id="name" x1="0" x2="1">
<stop offset="0" stop-color="#e0f2fe"/>
<stop offset=".45" stop-color="#ffffff"/>
<stop offset="1" stop-color="#a5f3fc"/>
</linearGradient>
</defs>

